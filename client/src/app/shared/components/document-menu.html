<div
  class="dh-rise absolute top-full right-0 z-50 mt-1 w-44 overflow-hidden rounded-dh border border-hairline bg-surface-1 py-1 shadow-dh-lg"
  role="menu"
>
  <a [routerLink]="['/docs', doc().id]" class="dh-menu-item" role="menuitem">
    <i class="pi pi-eye text-[11px]"></i> Open
  </a>
  @if (downloadUrl(); as href) {
    <a
      class="dh-menu-item"
      role="menuitem"
      [href]="href"
      [attr.download]="doc().fileName"
      (click)="dismiss.emit()"
    >
      <i class="pi pi-download text-[11px]"></i> Download
    </a>
  }
  <!-- Re-indexing a document that is mid-ingestion would only queue a second
       run of the job already working on it. -->
  @if (doc().status !== 'indexing') {
    <button type="button" class="dh-menu-item" role="menuitem" (click)="reindex.emit()">
      <i class="pi pi-refresh text-[11px]"></i> Re-index
    </button>
  }
  <div class="my-1 h-px bg-hairline"></div>
  <!-- Out to the repository rather than delete. The hub cannot remove a file
       it does not own, and the place to change one is where it is edited. -->
  <a
    class="dh-menu-item"
    role="menuitem"
    [href]="doc().webUrl"
    target="_blank"
    rel="noreferrer noopener"
    (click)="dismiss.emit()"
  >
    <i class="pi pi-external-link text-[11px]"></i> View in GitLab
  </a>
</div>
