<button
  type="button"
  class="dh-icon-btn"
  (click)="toggleSidebar.emit()"
  aria-label="Toggle navigation"
>
  <i class="pi pi-bars text-[15px]"></i>
</button>

<!-- One omnibox for both "find a document" and "ask a
     question". Clicking it opens the command palette. -->
<button
  type="button"
  class="group flex h-9 min-w-0 flex-1 items-center gap-2.5 rounded-dh border border-hairline bg-surface-2/70 px-3 text-left transition hover:border-hairline-strong hover:bg-surface-2"
  (click)="palette.show()"
>
  <i class="pi pi-search shrink-0 text-[13px] text-subtle"></i>
  <span class="truncate text-[13px] text-subtle">Search documents or ask a question…</span>
  <kbd
    class="ml-auto hidden shrink-0 rounded-md border border-hairline bg-surface-1 px-1.5 py-0.5 font-sans text-[10.5px] font-medium text-subtle sm:block"
  >
    ⌘K
  </kbd>
</button>

<div class="flex shrink-0 items-center gap-1">

  <div class="relative ml-1">
    <button
      type="button"
      class="rounded-full transition hover:opacity-85"
      [dhTooltip]="currentUser().name + ' · ' + (auth.role() ?? '')"
      tooltipPosition="bottom"
      (click)="menuOpen.set(!menuOpen())"
      aria-label="Account"
    >
      <dh-avatar [person]="currentUser()" size="md" />
    </button>

    @if (menuOpen()) {
      <!-- Closes on any outside click; a menu that only closes on its own
           button is one users end up clicking twice. -->
      <div class="fixed inset-0 z-40" (click)="menuOpen.set(false)"></div>

      <div class="dh-card absolute right-0 z-50 mt-2 w-56 p-1.5 shadow-dh-lg" role="menu">
        <div class="px-2.5 py-2">
          <p class="truncate text-[12.5px] font-medium text-ink">{{ currentUser().name }}</p>
          <p class="truncate text-[11.5px] text-subtle">{{ auth.currentUser()?.email }}</p>
          <p class="mt-1 text-[11px] text-subtle">{{ auth.role() }}</p>
        </div>

        <hr class="dh-divider my-1" />

        @if (auth.isAdmin()) {
          <a
            class="flex items-center gap-2 rounded-dh px-2.5 py-1.5 text-[12.5px] text-ink transition hover:bg-surface-2"
            routerLink="/users"
            role="menuitem"
            (click)="menuOpen.set(false)"
          >
            <i class="pi pi-users text-[12px] text-subtle"></i>
            People
          </a>
        }

        <button
          type="button"
          class="flex w-full items-center gap-2 rounded-dh px-2.5 py-1.5 text-left text-[12.5px] text-ink transition hover:bg-surface-2"
          role="menuitem"
          (click)="signOut()"
        >
          <i class="pi pi-lock text-[12px] text-subtle"></i>
          Sign out
        </button>
      </div>
    }
  </div>
</div>
